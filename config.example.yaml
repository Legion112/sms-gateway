# Copy to config.yaml or /etc/sms-gateway/config.yaml
#
# Legacy single-modem CLI settings (used when modems: is not configured):
driver: mm   # mm | serial

serial:
  device: auto        # auto | /dev/ttyUSB2 | ...
  baud_rate: 115200
  timeout: 2s

mm:
  modem_index: 0      # logical index (0 = first modem from mmcli -L); not the D-Bus path suffix
  # modem_path: /org/freedesktop/ModemManager1/Modem/1  # optional explicit D-Bus path
  timeout: 5s

# --- Multi-modem (recommended when more than one SIM/modem) ---

default_modem: ec25-main

# SIM-centric line numbers (ICCID from status or modems list --discover)
sim_numbers:
  "8999801234567890123": "+998901234567"
  "8999809876543210987": "+998909876543"

modems:
  ec25-main:
    driver: mm
    mm:
      modem_index: 0
      timeout: 5s
  ec25-backup:
    driver: mm
    mm:
      modem_index: 1
      timeout: 5s
    # Radio posture, asserted by the watch daemon each time it opens the modem
    # (serial driver only; ModemManager owns this for mm modems). Both settings
    # default to auto, which is what you want: a modem locked to LTE receives
    # SMS only where the visited network carries it over SGs/CSFB or IMS, and a
    # manually pinned operator will not reselect when that network degrades.
    # Either one lets a modem register, poll clean and report healthy while no
    # message can reach it.
    #
    #   scan_mode: auto | gsm | wcdma | lte | keep     (default auto)
    #   operator:  auto | keep                         (default auto)
    #
    # Use keep for a modem that is locked deliberately:
    # radio:
    #   scan_mode: keep
    #   operator: keep

channels:
  my-telegram:
    driver: telegram_bot
    telegram:
      bot_token: ""              # prefer env SMS_GATEWAY_CHANNEL_MY_TELEGRAM_BOT_TOKEN
      chat_id: 123456789         # private chat with your bot (send /start first)
      # proxy_url: socks5://127.0.0.1:1080   # optional; SSH SOCKS tunnel when Telegram is blocked

  vika-telegram:
    driver: telegram_bot
    telegram:
      bot_token: ""
      chat_id: 987654321

  backup-sms:
    driver: sms                  # not implemented yet
    sms:
      modem: ec25-backup
      number: "+1234567890"

  ops-email:
    driver: email                # not implemented yet
    email:
      smtp_host: smtp.example.com
      to: ops@example.com

# Route by recipient line (sim_numbers), not modem slot. First match wins.
forward_rules:
  - name: bank-otp
    to_line: "+99888888888"
    from: "+1234567890"
    to: [my-telegram]

  - name: line-a
    to_line: "+99888888888"
    from: "*"
    to: [my-telegram]

  - name: line-b
    to_line: "+99811111111"
    from: "*"
    to: [vika-telegram]

  - name: default
    to_line: "*"                 # any recipient, including unmapped SIMs
    from: "*"
    to: [my-telegram]

# --- Watch daemon (sms-gateway-watch) ---

storage:
  path: ./data/sms.db

watch:
  catch_up_on_start: true
  serial_poll_interval: 10s
  concat_assembly_timeout: 60s
  # Free the modem storage slot once every channel for a message is delivered.
  # The local database keeps the message, so nothing is lost. Without this the
  # modem fills up (EC25 holds 255) and then silently refuses new SMS.
  delete_after_forward: true

  # --- Liveness ---
  # A modem whose watch loop fails is reopened rather than abandoned, so a USB
  # hiccup or a modem that stops answering AT can never take a SIM out of
  # service until the next manual restart. The delay doubles from
  # reconnect_initial up to reconnect_max and then retries at that interval
  # forever: the daemon never gives up on a SIM.
  reconnect_initial: 2s
  reconnect_max: 60s
  # A modem that is open but has completed no poll in this long is reported as
  # modem_stalled, and modem_recovered once polling resumes.
  stall_timeout: 5m
  # Heartbeat so the journal carries positive proof that reception is alive
  # rather than only ever showing failures.
  health_interval: 30m
  # How often to read each modem's registration domain by domain, which is the
  # only way to see a modem that is attached for data while an incoming SMS has
  # no way in. Read between SMS polls, on the goroutine that owns the AT port.
  registration_interval: 2m
  # Where the daemon publishes what it knows about its modems, so `status` can
  # report them while the daemon holds their ports. Defaults to
  # watch-state.json beside storage.path; uncomment to put it elsewhere.
  #state_path: /run/sms-gateway/watch-state.json

# --- Operational alerts (about the gateway itself, not received SMS) ---
#
# A modem that has not completed a poll for `after` is reported once, and
# reported again when it starts polling. Leave `channels` empty to switch
# alerting off; modem outages are then only visible in the journal.
#
# Today alerts leave through the forward channels listed here, because
# everything is one binary. The transport sits behind an interface, so pointing
# this at a separate notification service later does not touch the policy.
alerts:
  after: 5m
  channels: [my-telegram]
  # Alert when a modem has been attached for `after` with no circuit-switched
  # and no IMS registration, which is the one state where everything else looks
  # healthy and an SMS may still have nowhere to arrive. Set to false to keep
  # the journal lines without the alert: a network that really does carry SMS
  # over SGs for a roaming SIM reads the same way, so this can fire on a modem
  # that is in fact fine.
  sms_path: true

# --- Translating inbound SMS ---
#
# A reading of the message in a language you understand, added underneath the
# original. The original is always forwarded unchanged: a machine translation of
# a bank SMS can get a currency wrong, so it is an addition to the message and
# never a replacement for it.
#
# The engine is a translation service you run yourself -- deploy/translate has
# one -- because no message text is to reach a hosted API. It is reached over
# HTTP, it is expected to be unreachable sometimes, and when it is, the message
# is forwarded exactly as it would have been with this section absent.
translate:
  enabled: false
  # Anything speaking the LibreTranslate API: POST /translate with q, source
  # and target. The path is appended if you leave it off.
  endpoint: http://192.0.2.10:5000
  # Set this and the service's API_KEY to the same value if the service listens
  # on a network shared with anything else. Also readable from
  # SMS_GATEWAY_TRANSLATE_API_KEY, and the endpoint from
  # SMS_GATEWAY_TRANSLATE_ENDPOINT, so neither has to live in this file.
  #api_key: some-shared-secret
  # What to translate into: en or ru.
  target: en
  # The languages you cannot read. This is a list rather than a switch because
  # these SIMs receive more Russian than Uzbek, and translating a message you
  # could already read adds a paragraph of noise to it. Messages in any other
  # language, and messages carrying both, are forwarded untouched.
  sources: [uz]
  # Spent on the delivery path, so kept short: a translation that misses this
  # budget is dropped rather than waited for.
  timeout: 10s
  # Operator broadcasts repeat verbatim and both modems receive them, so a
  # small cache removes most of the engine's work.
  cache_size: 256
