# Copy to config.yaml or /etc/sms-gateway/config.yaml
#
# Legacy single-modem CLI settings (used when modems: is not configured):
driver: mm   # mm | serial

serial:
  device: auto        # auto | /dev/ttyUSB2 | ...
  baud_rate: 115200
  timeout: 2s

mm:
  modem_index: 0      # logical index (0 = first modem from mmcli -L); not the D-Bus path suffix
  # modem_path: /org/freedesktop/ModemManager1/Modem/1  # optional explicit D-Bus path
  timeout: 5s

# --- Multi-modem (recommended when more than one SIM/modem) ---

default_modem: ec25-main

# SIM-centric line numbers (ICCID from status or modems list --discover)
sim_numbers:
  "8999801234567890123": "+998901234567"
  "8999809876543210987": "+998909876543"

modems:
  ec25-main:
    driver: mm
    mm:
      modem_index: 0
      timeout: 5s
  ec25-backup:
    driver: mm
    mm:
      modem_index: 1
      timeout: 5s

channels:
  my-telegram:
    driver: telegram_bot
    telegram:
      bot_token: ""              # prefer env SMS_GATEWAY_CHANNEL_MY_TELEGRAM_BOT_TOKEN
      chat_id: 123456789         # private chat with your bot (send /start first)
      # proxy_url: socks5://127.0.0.1:1080   # optional; SSH SOCKS tunnel when Telegram is blocked

  vika-telegram:
    driver: telegram_bot
    telegram:
      bot_token: ""
      chat_id: 987654321

  backup-sms:
    driver: sms                  # not implemented yet
    sms:
      modem: ec25-backup
      number: "+1234567890"

  ops-email:
    driver: email                # not implemented yet
    email:
      smtp_host: smtp.example.com
      to: ops@example.com

# Route by recipient line (sim_numbers), not modem slot. First match wins.
forward_rules:
  - name: bank-otp
    to_line: "+99888888888"
    from: "+1234567890"
    to: [my-telegram]

  - name: line-a
    to_line: "+99888888888"
    from: "*"
    to: [my-telegram]

  - name: line-b
    to_line: "+99811111111"
    from: "*"
    to: [vika-telegram]

  - name: default
    to_line: "*"                 # any recipient, including unmapped SIMs
    from: "*"
    to: [my-telegram]

# --- Watch daemon (sms-gateway-watch) ---

storage:
  path: ./data/sms.db

watch:
  catch_up_on_start: true
  serial_poll_interval: 10s
  concat_assembly_timeout: 60s
