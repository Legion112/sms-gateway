name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push that lands while an earlier run is still going makes that run's result
# meaningless, so cancel it rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Printed first so a failure names the offending files rather than only
      # failing the exit status.
      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      # Both invocations: the default one does not vet the integration-tagged
      # files, which is where the serial lab lives.
      - name: Vet
        run: make vet

      # -race matters here: the watch daemon supervises one goroutine per modem
      # plus a health reporter, and they share the health map.
      - name: Test
        run: go test ./... -race -count=1

      # The gateway runs on a Raspberry Pi. Cross-compiling for it keeps an
      # arch-specific break from reaching the only machine that matters.
      - name: Cross-compile for the Pi (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build ./cmd/...

  # The hooks this scanner installs are local to a clone and `--no-verify`
  # skips them, so this job is the only copy of the check that cannot be
  # bypassed or go stale. It runs from source rather than a built binary for
  # the same reason.
  leak:
    name: leak scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because -history walks every commit. The default
      # single-commit checkout would scan the tip and call the repository
      # clean while an older commit still carried an identifier.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Two passes with different reach. The tree pass is the one whose
      # failure names a file somebody can edit; the history pass is the one
      # that notices an identifier surviving in a commit nobody is looking at.
      - name: Scan the working tree
        run: go run ./cmd/sms-gateway-scan

      - name: Scan every blob in history
        run: go run ./cmd/sms-gateway-scan -history

  lab:
    name: serial lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The lab opens /dev/ptmx and hands the real serial driver a pts node it
      # then deletes mid-test. Checked up front so a missing devpts fails here,
      # naming the cause, rather than inside a test as a timeout.
      - name: pseudo-terminal support
        run: test -c /dev/ptmx || { echo "::error::/dev/ptmx missing, the serial lab cannot run"; exit 1; }

      # Run verbosely and judge the same output twice. A Go exit code does not
      # distinguish "passed" from "skipped itself", and a lab that skips looks
      # green while covering nothing.
      - name: serial lab
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -timeout 5m -v ./test/integration/... 2>&1 | tee /tmp/lab.log

      - name: no lab silently skipped
        if: always()
        run: |
          if grep -q -- '--- SKIP' /tmp/lab.log; then
            echo "::error::a lab skipped itself instead of running:"
            grep -B1 -- '--- SKIP' /tmp/lab.log
            exit 1
          fi
          echo "labs that ran: $(grep -c -- '--- PASS' /tmp/lab.log)"
